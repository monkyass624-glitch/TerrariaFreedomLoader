plugins {
    id "com.android.application"
}

android {
    namespace "com.freedomloader.terraria"
    compileSdk 36

    defaultConfig {
        applicationId "com.freedomloader.terraria"
        minSdk 23
        targetSdk 35
        versionCode 4
        versionName "0.3.1"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17 -Wall -Wextra -fvisibility=hidden"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".linked"
            versionNameSuffix "-linked"
        }
        release {
            minifyEnabled false
        }
    }

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging false
        }
    }
}
