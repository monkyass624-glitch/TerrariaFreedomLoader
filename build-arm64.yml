name: Build Freedom Loader runtime inspector (ARM64)

on:
  workflow_dispatch:
  push:
    paths:
      - 'runtime-inspector/**'
      - '.github/workflows/build-arm64.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: setup-ndk
        with:
          ndk-version: r27d
      - name: Configure NDK build
        run: |
          cmake -S runtime-inspector -B build-arm64 \
            -DCMAKE_TOOLCHAIN_FILE="${{ steps.setup-ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=arm64-v8a \
            -DANDROID_PLATFORM=android-23 \
            -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build-arm64 --config Release --parallel 2
      - name: Upload ARM64 shared library
        uses: actions/upload-artifact@v4
        with:
          name: freedom-runtime-inspector-arm64
          path: build-arm64/libfreedom_runtime_inspector.so
